spring.application.name=it-asset-service-management
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/itasm?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

jwt.secret=ItAsmPlacementDemoSecretKeyMustBeAtLeast256BitsLong!!2026
jwt.expiration-ms=86400000

app.seed=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Spring AI Configuration (Google Gemini via OpenAI-compatible endpoint)
spring.ai.openai.api-key=${AI_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.options.model=${AI_MODEL:gemini-1.5-flash}
