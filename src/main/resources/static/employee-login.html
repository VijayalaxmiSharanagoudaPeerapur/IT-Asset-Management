<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Employee Login - ITASM</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-body">
  <main class="login-card">
    <a href="/" class="back-link">&larr; Back to Portal Selection</a>
    <span class="role-badge employee">Employee Self-Service</span>
    <h1>Employee Sign In</h1>
    <p class="muted">Access your assigned equipment, request new hardware, and track IT support tickets.</p>
    
    <form id="employee-login-form">
      <label>Employee Username
        <input name="username" placeholder="Enter employee username" required autofocus />
      </label>
      <label>Password
        <input name="password" type="password" placeholder="Enter password" required />
      </label>
      <button type="submit" style="width: 100%; margin-top: 8px; background: #38bdf8; color: #0c2d48;">Sign In to Employee Portal</button>
      <p id="login-error" class="error" hidden style="margin-top: 12px;"></p>
    </form>

    <div class="hint">
      <p>Need Admin access? <a href="/admin-login.html" style="color: var(--accent);">Switch to Admin Login</a></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    document.getElementById("employee-login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const err = document.getElementById("login-error");
      err.hidden = true;
      const form = new FormData(e.target);
      try {
        const data = await api("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: form.get("username"), password: form.get("password") })
        });

        localStorage.setItem("itasm_token", data.token);
        localStorage.setItem("itasm_user", JSON.stringify(data));

        if (data.role === "ADMIN") {
          location.href = "/admin-dashboard.html";
        } else {
          location.href = "/employee-dashboard.html";
        }
      } catch (ex) {
        err.hidden = false;
        err.textContent = ex.message;
      }
    });
  </script>
</body>
</html>
